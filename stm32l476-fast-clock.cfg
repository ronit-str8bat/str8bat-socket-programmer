# Temporary programming clock, following upstream OpenOCD stm32l4x.cfg:
# https://github.com/openocd-org/openocd/blob/master/tcl/target/stm32l4x.cfg
# 24 MHz MSI / three flash wait states supports both normal voltage ranges.
# SYSRESETREQ at the end restores reset defaults before the application runs.
proc l476_wait_bits {address mask expected} {
    for {set attempt 0} {$attempt < 100} {incr attempt} {
        set value [lindex [read_memory $address 32 1] 0]
        if {($value & $mask) == $expected} {return}
        sleep 1
    }
    error [format {Register 0x%08x did not reach expected state} $address]
}
$_TARGETNAME configure -event reset-start {
    global PROGRAM_SWD_KHZ
    adapter speed [expr {$PROGRAM_SWD_KHZ < 500 ? $PROGRAM_SWD_KHZ : 500}]
}
proc l476_fast_clock_init {} {
    global PROGRAM_SWD_KHZ
    set id [lindex [read_memory 0xe0042000 32 1] 0]
    if {($id & 0xfff) != 0x415} {error {Fast clock requires STM32L47/L48 device ID 0x415}}
    set cr [lindex [read_memory 0x40021000 32 1] 0]
    set cfgr [lindex [read_memory 0x40021008 32 1] 0]
    # Require the reset clock state; do not modify an application PLL setup.
    if {($cfgr & 0xff) != 0 || ($cr & 0x01000003) != 3} {
        error {Expected MSI system clock, AHB divide by one, PLL off; refusing clock change}
    }
    mmw 0x40021058 0x10000000 0
    set pwr [lindex [read_memory 0x40007000 32 1] 0]
    set vos [expr {($pwr >> 9) & 3}]
    if {($vos != 1 && $vos != 2) || ($pwr & 0x4000) != 0} {
        error {Expected normal regulator mode with voltage range 1 or 2}
    }
    l476_wait_bits 0x40007014 0x400 0
    # Increase flash latency BEFORE increasing the CPU clock.
    mmw 0x40022000 0x00000103 0x00000007
    l476_wait_bits 0x40022000 7 3
    mmw 0x40021000 0x00000099 0x000000f0
    l476_wait_bits 0x40021000 0xfb 0x9b
    # Clear the same stale PGAERR / PGSERR status as the normal flash path.
    mww 0x40022010 0x000000a0
    echo {Temporary programming CPU clock: 24 MHz MSI; flash latency: 3 wait states}
    adapter speed $PROGRAM_SWD_KHZ
}
$_TARGETNAME configure -event reset-init {
    # OpenOCD can log event errors and continue. Explicitly stop the session
    # if a prerequisite or register readback fails, before any flash operation.
    if {[catch {l476_fast_clock_init} reason]} {
        echo $reason
        shutdown error
    }
}
