<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220">
  <style>
    .title { font: 700 30px Arial, sans-serif; fill:#09244d; }
    .sub { font: 16px Arial, sans-serif; fill:#26364b; }
    .head { font: 700 20px Arial, sans-serif; fill:#fff; }
    .text { font: 16px Arial, sans-serif; fill:#152438; }
    .small { font: 14px Arial, sans-serif; fill:#152438; }
    .pin { font: 700 15px Arial, sans-serif; fill:#152438; }
    .box { fill:#f8fbff; stroke:#225b9c; stroke-width:3; rx:12; }
    .pico { fill:#eef8ff; stroke:#0067a3; stroke-width:3; rx:12; }
    .target { fill:#f4fff1; stroke:#32824a; stroke-width:3; rx:12; }
    .power { fill:#fff9e8; stroke:#bd7b00; stroke-width:3; rx:12; }
    .led { fill:#fff2f4; stroke:#bf3852; stroke-width:3; rx:12; }
    .wire { fill:none; stroke:#253a56; stroke-width:3; }
    .swd { fill:none; stroke:#006db3; stroke-width:4; }
    .powerwire { fill:none; stroke:#c27b00; stroke-width:4; }
    .ground { fill:none; stroke:#222; stroke-width:3; }
    .note { fill:#fffce6; stroke:#a18a1b; stroke-width:2; rx:8; }
  </style>

  <rect width="1800" height="1220" fill="#ffffff"/>
  <text x="60" y="52" class="title">Pico 2 W Socket Programmer — Current Circuit Connections</text>
  <text x="60" y="80" class="sub">Firmware: common-anode LED1 and LED2 • STM32 target supply: 1.8 V • SWD programmer supply: Pico 3.3 V</text>

  <!-- Pico -->
  <rect x="60" y="130" width="435" height="760" class="pico"/>
  <rect x="60" y="130" width="435" height="48" fill="#0067a3" rx="12"/>
  <text x="196" y="162" class="head">Raspberry Pi Pico 2 W</text>
  <text x="88" y="215" class="pin">Header pin 2   • GP1</text><text x="290" y="215" class="text">NRST control</text>
  <text x="88" y="275" class="pin">Header pin 4   • GP2</text><text x="290" y="275" class="text">SWCLK</text>
  <text x="88" y="335" class="pin">Header pin 5   • GP3</text><text x="290" y="335" class="text">SWDIO</text>
  <text x="88" y="395" class="pin">Header pin 6   • GP4</text><text x="290" y="395" class="text">TXS0102 OE</text>
  <text x="88" y="455" class="pin">Header pin 7   • GP5</text><text x="290" y="455" class="text">LED2 cathode</text>
  <text x="88" y="515" class="pin">Header pin 10 • GP7</text><text x="290" y="515" class="text">LED1 red cathode</text>
  <text x="88" y="575" class="pin">Header pin 11 • GP8</text><text x="290" y="575" class="text">LED1 green cathode</text>
  <text x="88" y="635" class="pin">Header pin 12 • GP9</text><text x="290" y="635" class="text">LED1 blue cathode</text>
  <text x="88" y="695" class="pin">Header pin 24 • GP18</text><text x="290" y="695" class="text">START button</text>
  <text x="88" y="755" class="pin">Header pin 36 • 3V3(OUT)</text><text x="350" y="755" class="text">3.3 V</text>
  <text x="88" y="815" class="pin">GND • pin 3 / 8 / 13 / 18 / 23 / 28 / 38</text>
  <text x="88" y="853" class="small">GP6 is not used.</text>

  <!-- TXS -->
  <rect x="690" y="200" width="330" height="350" class="box"/>
  <rect x="690" y="200" width="330" height="48" fill="#225b9c" rx="12"/>
  <text x="782" y="232" class="head">TXS0102V</text>
  <text x="728" y="282" class="small">B side — 3.3 V Pico side</text>
  <text x="826" y="310" class="small">A side — 1.8 V STM32 side</text>
  <text x="712" y="350" class="pin">B1</text><text x="940" y="350" class="pin">A1</text>
  <text x="712" y="415" class="pin">B2</text><text x="940" y="415" class="pin">A2</text>
  <text x="712" y="485" class="pin">OE</text><text x="800" y="485" class="small">HIGH = enabled</text>
  <text x="712" y="525" class="small">VCCB = 3.3 V • VCCA = 1.8 V • GND = common</text>

  <!-- Target -->
  <rect x="1280" y="205" width="410" height="340" class="target"/>
  <rect x="1280" y="205" width="410" height="48" fill="#32824a" rx="12"/>
  <text x="1390" y="237" class="head">STM32L476 Target</text>
  <text x="1310" y="305" class="pin">PA14</text><text x="1410" y="305" class="text">SWCLK</text>
  <text x="1310" y="370" class="pin">PA13</text><text x="1410" y="370" class="text">SWDIO</text>
  <text x="1310" y="435" class="pin">NRST</text><text x="1410" y="435" class="text">reset input</text>
  <text x="1310" y="500" class="pin">VDD = 1.8 V</text><text x="1510" y="500" class="text">GND = common</text>

  <!-- SWD wires -->
  <path d="M495 275 H690" class="swd"/><text x="525" y="262" class="small">GP2 / SWCLK</text>
  <path d="M1020 350 H1280" class="swd"/><text x="1075" y="337" class="small">A1 → PA14</text>
  <path d="M495 335 H690" class="swd"/><text x="525" y="322" class="small">GP3 / SWDIO</text>
  <path d="M1020 415 H1280" class="swd"/><text x="1075" y="402" class="small">A2 ↔ PA13</text>
  <path d="M495 395 H650 V485 H690" class="wire"/><text x="510" y="384" class="small">GP4 → OE</text>
  <path d="M495 215 H1160 V435 H1280" class="wire"/><text x="760" y="202" class="small">GP1 → NRST (target reset)</text>
  <path d="M495 695 H605" class="wire"/><circle cx="620" cy="695" r="18" fill="#fff" stroke="#253a56" stroke-width="3"/><path d="M638 695 H670" class="wire"/>
  <text x="510" y="680" class="small">GP18</text><text x="596" y="730" class="small">START push button</text><text x="602" y="750" class="small">to GND</text>

  <!-- LEDs -->
  <rect x="690" y="645" width="510" height="230" class="led"/>
  <rect x="690" y="645" width="510" height="48" fill="#bf3852" rx="12"/>
  <text x="825" y="677" class="head">External LEDs — Common Anode</text>
  <text x="720" y="730" class="text">LED1 RGB common anode → 3.3 V</text>
  <text x="720" y="762" class="small">GP7 → resistor → Red cathode</text>
  <text x="720" y="790" class="small">GP8 → resistor → Green cathode</text>
  <text x="720" y="818" class="small">GP9 → resistor → Blue cathode</text>
  <text x="965" y="730" class="text">LED2 anode → 3.3 V</text>
  <text x="965" y="762" class="small">GP5 → resistor → LED2 cathode</text>
  <text x="720" y="854" class="small">GPIO LOW turns the selected LED colour / LED2 ON.</text>
  <path d="M495 455 H650 V762 H690" class="wire"/><text x="505" y="445" class="small">GP5</text>
  <path d="M495 515 H630 V762 H690" class="wire"/><text x="505" y="505" class="small">GP7</text>
  <path d="M495 575 H620 V790 H690" class="wire"/><text x="505" y="565" class="small">GP8</text>
  <path d="M495 635 H610 V818 H690" class="wire"/><text x="505" y="625" class="small">GP9</text>

  <!-- Power -->
  <rect x="1270" y="675" width="420" height="235" class="power"/>
  <rect x="1270" y="675" width="420" height="48" fill="#bd7b00" rx="12"/>
  <text x="1370" y="707" class="head">Power Connections</text>
  <text x="1300" y="760" class="text">Pico 3V3(OUT) → TXS0102 VCCB</text>
  <text x="1300" y="792" class="text">Pico 3V3(OUT) → LDK120C18R IN and EN</text>
  <text x="1300" y="824" class="text">LDK120C18R OUT (1.8 V) → STM32 VDD + TXS0102 VCCA</text>
  <text x="1300" y="856" class="text">All grounds connected together</text>
  <text x="1300" y="888" class="small">Fit the regulator input/output capacitors required by the LDK120 datasheet.</text>
  <path d="M495 755 H1270" class="powerwire"/><text x="1030" y="742" class="small">3.3 V</text>
  <path d="M1490 910 V980 H1450 V545" class="powerwire"/><text x="1500" y="958" class="small">1.8 V to target VDD</text>

  <!-- Ground bar -->
  <path d="M80 1045 H1700" class="ground"/>
  <path d="M250 890 V1045 M850 550 V1045 M1480 545 V1045 M1480 910 V1045" class="ground"/>
  <text x="750" y="1082" class="text">COMMON GROUND: Pico GND ↔ TXS0102 GND ↔ STM32 GND ↔ LDK120 GND ↔ button GND</text>

  <rect x="60" y="1110" width="1630" height="70" class="note"/>
  <text x="82" y="1140" class="small">Important: TXS0102 is only for GP2/SWCLK and GP3/SWDIO. GP1/NRST is direct. Use one current-limiting resistor for every LED cathode.</text>
  <text x="82" y="1163" class="small">TXS0102 OE is controlled by GP4: it is enabled only while the programmer needs SWD. Do not connect GP6.</text>
</svg>
